name: Build Fauna Dynamics

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Extract Fauna Dynamics source
        run: |
          mkdir -p "$RUNNER_TEMP/fauna-source"
          tar -xzf .github/fauna-dynamics-source.tar.gz -C "$RUNNER_TEMP/fauna-source"
          cp -a "$RUNNER_TEMP/fauna-source/fauna-dynamics-fabric/." "$GITHUB_WORKSPACE/"

      - name: Inspect source layout for animation integration
        run: |
          find src/main/java -type f -name '*.java' -print
          echo '=== mixin config ==='
          cat src/main/resources/faunadynamics.mixins.json
          echo '=== fabric metadata ==='
          cat src/main/resources/fabric.mod.json
          echo '=== animal controller ==='
          sed -n '1,650p' src/main/java/com/faunadynamics/behavior/AnimalBehaviorController.java
          echo '=== animation states ==='
          cat src/main/java/com/faunadynamics/behavior/AnimationStates.java
          echo '=== tags ==='
          cat src/main/java/com/faunadynamics/behavior/AnimalTags.java
          echo '=== entrypoint ==='
          cat src/main/java/com/faunadynamics/FaunaDynamics.java
          echo '=== spawn egg mixin ==='
          cat src/main/java/com/faunadynamics/mixin/AnimalBreedingMixin.java
          echo '=== thrown egg mixin ==='
          cat src/main/java/com/faunadynamics/mixin/ThrownEggMixin.java
          echo '=== config ==='
          cat src/main/java/com/faunadynamics/config/FaunaConfig.java


      - name: Apply Minecraft 26.3 compatibility fixes
        run: python3 .github/apply-26.3-compat.py
      - name: Apply native animation and horn integration
        run: python3 .github/apply-visual-patches.py

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.2'

      - name: Verify project files
        run: |
          test -f build.gradle
          test -f src/main/resources/fabric.mod.json
          grep -q 'fabric_api_version=0.166.2+26.3' gradle.properties

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Inspect Minecraft model field inheritance
        shell: bash
        run: |
          GAME_JAR="$(find .gradle/loom-cache/minecraftMaven/net/minecraft -name 'minecraft-merged-*-26.3.jar' -print -quit)"
          test -n "$GAME_JAR"
          echo "Mapped Minecraft jar: $GAME_JAR"
          for target in \
            net.minecraft.client.model.animal.feline.AdultFelineModel \
            net.minecraft.client.model.animal.feline.BabyFelineModel \
            net.minecraft.client.model.animal.feline.AbstractFelineModel \
            net.minecraft.client.model.animal.feline.FelineModel \
            net.minecraft.client.model.animal.wolf.WolfModel \
            net.minecraft.client.model.QuadrupedModel \
            net.minecraft.client.model.animal.sheep.SheepModel \
            net.minecraft.client.model.animal.equine.AbstractEquineModel \
            net.minecraft.client.model.animal.chicken.ChickenModel \
            net.minecraft.client.model.geom.ModelPart; do
            echo "=== $target ==="
            javap -classpath "$GAME_JAR" -p "$target" 2>&1 || true
          done

      - name: Client launch smoke test (Xvfb + Mesa Vulkan)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers vulkan-tools
          test -f /usr/share/vulkan/icd.d/lvp_icd.json
          Xvfb :99 -screen 0 854x480x24 +extension GLX +render -noreset > /tmp/fauna-xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json
          export LIBGL_ALWAYS_SOFTWARE=1
          vulkaninfo --summary || true
          set +e
          timeout 70s gradle --no-daemon runClient > client-smoke.log 2>&1
          status=$?
          set -e
          echo "runClient exit status: $status"
          tail -n 220 client-smoke.log
          if grep -E -i 'IllegalClassLoadError|InvalidInjectionException|Mixin apply failed|Critical injection failure|NoSuchMethodError|NoSuchFieldError|MixinTransformerError|Exception loading class' client-smoke.log; then
            echo "Client smoke test found a fatal Mixin/classloading error."
            exit 1
          fi
          if [ "$status" -eq 124 ] && grep -q 'Reloading ResourceManager' client-smoke.log; then
            echo "Minecraft reached initial resource/model loading and stayed alive until the smoke-test timeout."
          elif [ "$status" -eq 0 ] && grep -q 'Reloading ResourceManager' client-smoke.log; then
            echo "Minecraft client run completed without a detected Mixin error."
          else
            echo "Minecraft client did not reach a stable startup state."
            exit 1
          fi

      - name: Upload JAR artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fauna-dynamics-fabric-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
